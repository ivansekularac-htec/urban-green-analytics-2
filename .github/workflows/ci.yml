# This workflow will install Python dependencies, run tests and lint with a single version of Python

name: Urban Green Analytics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest

    outputs:
      api: ${{ steps.filter.outputs.api }}
      mcp: ${{ steps.filter.outputs.mcp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            mcp:
              - 'mcp/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'

  api-ci:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: test
      POSTGRES_SCHEMA: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "api/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: ./api

      - name: Run ruff check
        run: uv run ruff check app tests
        working-directory: ./api

      - name: Run ruff format
        run: uv run ruff format --check app tests
        working-directory: ./api

      - name: Run tests
        run: uv run pytest
        working-directory: ./api

  mcp-ci:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev
        working-directory: ./mcp

      - name: Run ruff check
        run: uv run ruff check app tests
        working-directory: ./mcp

      - name: Run ruff format
        run: uv run ruff format --check app tests
        working-directory: ./mcp

      - name: Run tests
        run: uv run pytest
        working-directory: ./mcp