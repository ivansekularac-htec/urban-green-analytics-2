# This workflow will install Python dependencies, run tests and lint the MCP service

name: Urban Green MCP

# The workflow always runs, and the jobs below skip themselves when the PR does
# not touch mcp/. A path filter on the trigger would stop the workflow from
# running at all, so a required status check would never be reported and the
# pull request could not be merged.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mcp: ${{ steps.filter.outputs.mcp }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mcp:
              - 'mcp/**'
              - 'docker-compose.yaml'
              - '.github/workflows/mcp-ci.yml'

  lint-and-test:
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest

    env:
      MCP_HOST: 127.0.0.1
      MCP_PORT: 8001

    steps:
      # 1. Check out your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install uv and enable automatic caching
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"

      # 3. Install project dependencies using uv sync
      - name: Install dependencies
        # --frozen ensures CI fails if uv.lock is out of sync with pyproject.toml
        run: uv sync --frozen --group dev
        working-directory: ./mcp

      # 4. Execute test or linters using uv run
      - name: Run ruff check
        run: uv run ruff check app tests
        working-directory: ./mcp

      - name: Run ruff format
        run: uv run ruff format --check app tests
        working-directory: ./mcp

      - name: Run tests
        run: uv run pytest --cov=app --cov-report=term-missing
        working-directory: ./mcp

      # 5. Verify the image the compose stack will actually run
      - name: Build MCP Docker image
        run: docker compose build urbangreen-mcp
