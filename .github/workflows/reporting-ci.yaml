name: Urban Green Analytics Reporting CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "reports/**"
      - "tests/reports/**"
      - "etl/dags/daily_executive_report.py"
      - "infra/airflow/**"
      - "docker-compose.yaml"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run lint checks
        run: uv run ruff check reports tests/reports etl/dags/daily_executive_report.py

      - name: Check formatting
        run: uv run ruff format --check reports tests/reports etl/dags/daily_executive_report.py

      - name: Run reporting tests
        run: uv run pytest

      - name: Validate compose configuration
        run: docker compose config --quiet
