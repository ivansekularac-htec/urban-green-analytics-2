# Loki single-binary, filesystem chunks. Dev scope - no production tuning.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # The airflow-logs volume carries weeks of backlog; widen the age window to
  # 30 days (default 168h) so first ingest is not rejected as too old, while
  # still keeping a bound.
  reject_old_samples_max_age: 720h
  # Absorb the initial backlog burst without 429s (defaults are 4MB/s, 6MB).
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128

# Don't phone home usage stats - this is a local dev stack.
analytics:
  reporting_enabled: false
