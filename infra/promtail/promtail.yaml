server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yml

clients:
  - url: http://urbangreen-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        regex: /urbangreen-.*
        action: keep
      - source_labels: [__meta_docker_container_name]
        regex: /(urbangreen-.*)
        replacement: ${1}
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream
    pipeline_stages:
      - docker: {}

  - job_name: airflow-task-files
    static_configs:
      - targets: [localhost]
        labels:
          service: urbangreen-airflow
          __path__: /opt/airflow/logs/dag_id=*/run_id=*/task_id=*/*.log
    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/dag_id=(?P<dag>[^/]+)/run_id=(?P<run_id>[^/]+)/task_id=(?P<task>[^/]+)/.*\.log$'
      - labels:
          dag:
          run_id:
          task:
