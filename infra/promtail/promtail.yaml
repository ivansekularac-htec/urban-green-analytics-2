server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://urbangreen-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels:
          - __meta_docker_container_name
        regex: /urbangreen-.*
        action: keep

      - source_labels:
          - __meta_docker_container_name
        regex: /(urbangreen-.*)
        target_label: service
        replacement: $1

    pipeline_stages:
      - drop:
          older_than: 1h
          drop_counter_reason: docker_backlog_too_old

  - job_name: airflow
    static_configs:
      - targets:
          - localhost
        labels:
          service: urbangreen-airflow
          __path__: /opt/airflow/logs/dag_id=*/run_id=*/task_id=*/*.log

    pipeline_stages:
      - regex:
          source: filename
          expression: '.*/dag_id=(?P<dag>[^/]+)/run_id=(?P<run_id>[^/]+)/task_id=(?P<task>[^/]+)/.*\.log$'

      - labels:
          dag:
          run_id:
          task: