apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://urbangreen-prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    type: loki
    access: proxy
    # No :-default here - Grafana's own ${...} substitution doesn't support
    # bash-style fallback syntax, it treats everything inside the braces as
    # one literal env var name.
    url: http://urbangreen-loki:${LOKI_PORT}
    isDefault: false
    editable: false