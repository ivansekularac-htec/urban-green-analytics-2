# Enables Spark's built-in PrometheusServlet sink on master, workers, and the
# streaming driver - no JMX exporter jar, no new ports, no new containers.
# https://spark.apache.org/docs/latest/monitoring.html#metrics
#
# Both .class and .path are required for every component below. .class alone
# registers the sink but does not bind it to a URL - without .path the
# servlet never mounts, and the endpoint just 404s with no error in the logs.

# Applies to every instance (master, worker, driver, applications, executor)
# unless a more specific instance.* line below overrides it.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# The master daemon runs two separate metric registries on the same web UI
# port: "master" for the daemon itself (alive workers, RPC queue) and
# "applications" for the apps it's tracking. Without distinct paths they'd
# collide trying to bind the same URL on the same embedded Jetty server.
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# JVM internals (heap, GC, thread counts) for the three long-lived daemons.
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource