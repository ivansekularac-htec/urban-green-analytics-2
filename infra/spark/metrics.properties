# Spark's built-in Prometheus sink (PrometheusServlet). It binds onto each
# component's existing Web UI port - the master on 8090, the workers on their
# default 8081, the streaming driver on 4050 - so there is no new port to
# publish, no extra container, and no JMX exporter JAR to manage.
#
# Both the .class and the .path keys are required for every component. Without
# an explicit .path the servlet does not bind and the URL 404s silently.

# Enable the sink on every instance (master, worker, driver, application).
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# The master gets its own path so its component metrics are distinguishable
# from the per-application metrics served on the default path.
master.sink.prometheusServlet.path=/metrics/master/prometheus
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

# JVM internals - heap, GC and thread state - are useful on the dashboard.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
