# Expose Spark metrics through each component's existing Web UI.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

master.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
master.sink.prometheusServlet.path=/metrics/master/prometheus

applications.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
applications.sink.prometheusServlet.path=/metrics/applications/prometheus

worker.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
worker.sink.prometheusServlet.path=/metrics/prometheus

driver.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
driver.sink.prometheusServlet.path=/metrics/prometheus

# Include JVM heap, GC, thread and runtime metrics.
*.source.jvm.class=org.apache.spark.metrics.source.JvmSource
